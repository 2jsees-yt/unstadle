name: Update YouTube subscriber counts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update subscriber counts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-subscribers.mjs

      - name: Commit updated subscriber data
        run: |
          if git diff --quiet -- subscribers.json; then
            echo "Subscriber counts did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          git commit -m "Update YouTube subscriber counts"
          git push
